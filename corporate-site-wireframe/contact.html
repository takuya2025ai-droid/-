<main>
  <div class="wrap">
    <p class="breadcrumb">トップ &gt; お問い合わせ</p>
    <div class="page-title">
      <h1><span class="grad-text">お問い合わせ</span></h1>
      <p>組織の課題を一緒に特定するところから始めませんか。以下のフォームにご入力のうえ、送信してください。</p>
    </div>
  </div>

  <section class="section">
    <div class="wrap" style="max-width:640px;">
      <form>
        <div class="form-row">
          <label>お名前<span class="required">必須</span></label>
          <input type="text" placeholder="例：藤田 拓也">
        </div>

        <div class="form-row">
          <label>会社名（法人の場合）</label>
          <input type="text" placeholder="例：株式会社ユアプロ">
        </div>

        <div class="form-row">
          <label>メールアドレス<span class="required">必須</span></label>
          <input type="email" placeholder="例：info@yourpro.jp">
        </div>

        <div class="form-row">
          <label>電話番号</label>
          <input type="tel" placeholder="例：029-886-8017">
        </div>

        <div class="form-row">
          <label>お問い合わせ内容<span class="required">必須</span></label>
          <textarea rows="6" placeholder="お問い合わせ内容をご記入ください"></textarea>
        </div>

        <button class="btn btn-gradient" type="submit" style="width:100%;border:none;cursor:pointer;">送信する</button>
      </form>
    </div>
  </section>
</main>
